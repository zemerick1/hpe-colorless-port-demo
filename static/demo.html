<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colorless Ports</title>
  <link rel="stylesheet" href="/static/site.css">
  <link rel="stylesheet" href="/static/demo.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow" id="platform-label">AOS-CX 6200F</p>
      <h1>Colorless Ports</h1>
    </div>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Loading</span>
    </div>
    <a class="button" href="/admin">Admin</a>
  </header>
  <p class="banner" id="banner" hidden></p>
  <div class="platform-switch">
    <div class="group" role="group" aria-label="Faceplate">
      <button type="button" id="platform-cx" aria-pressed="true">AOS-CX</button>
      <button type="button" id="platform-ex" aria-pressed="false">EX</button>
    </div>
  </div>
  <main>
    <div class="stage">
      <div id="faceplate" class="faceplate is-active" data-platform="cx">
        <img src="/static/faceplate.png" alt="Aruba 6200F 12-port switch front panel" width="1254" height="216">
        <button type="button" id="port-1" class="port" data-port="1" data-row="top" aria-label="Port 1" style="left:5.18%;top:26.39%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-3" class="port" data-port="3" data-row="top" aria-label="Port 3" style="left:10.69%;top:26.39%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-5" class="port" data-port="5" data-row="top" aria-label="Port 5" style="left:16.19%;top:26.39%;width:4.63%;height:22.69%"></button>
        <button type="button" id="port-7" class="port" data-port="7" data-row="top" aria-label="Port 7" style="left:21.61%;top:26.39%;width:4.78%;height:22.69%"></button>
        <button type="button" id="port-9" class="port" data-port="9" data-row="top" aria-label="Port 9" style="left:27.11%;top:26.39%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-11" class="port" data-port="11" data-row="top" aria-label="Port 11" style="left:32.62%;top:26.39%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-2" class="port" data-port="2" data-row="bottom" aria-label="Port 2" style="left:5.18%;top:59.26%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-4" class="port" data-port="4" data-row="bottom" aria-label="Port 4" style="left:10.69%;top:59.26%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-6" class="port" data-port="6" data-row="bottom" aria-label="Port 6" style="left:16.19%;top:59.26%;width:4.63%;height:22.69%"></button>
        <button type="button" id="port-8" class="port" data-port="8" data-row="bottom" aria-label="Port 8" style="left:21.61%;top:59.26%;width:4.78%;height:22.69%"></button>
        <button type="button" id="port-10" class="port" data-port="10" data-row="bottom" aria-label="Port 10" style="left:27.11%;top:59.26%;width:4.70%;height:22.69%"></button>
        <button type="button" id="port-12" class="port" data-port="12" data-row="bottom" aria-label="Port 12" style="left:32.62%;top:59.26%;width:4.70%;height:22.69%"></button>
      </div>
      <div id="faceplate-ex" class="faceplate" data-platform="ex">
        <img src="/static/ex12p.png" alt="Juniper EX4000 12-port switch front panel" width="1050" height="177">
        <button type="button" class="port" data-port="0" data-row="top" aria-label="Port ge-0/0/0" style="left:23.62%;top:25.99%;width:4.48%;height:20.34%"></button>
        <button type="button" class="port" data-port="2" data-row="top" aria-label="Port ge-0/0/2" style="left:28.86%;top:25.99%;width:4.57%;height:20.34%"></button>
        <button type="button" class="port" data-port="4" data-row="top" aria-label="Port ge-0/0/4" style="left:34.19%;top:25.99%;width:4.48%;height:20.34%"></button>
        <button type="button" class="port" data-port="6" data-row="top" aria-label="Port ge-0/0/6" style="left:39.43%;top:25.99%;width:4.57%;height:20.34%"></button>
        <button type="button" class="port" data-port="8" data-row="top" aria-label="Port ge-0/0/8" style="left:44.76%;top:25.99%;width:4.57%;height:20.34%"></button>
        <button type="button" class="port" data-port="10" data-row="top" aria-label="Port ge-0/0/10" style="left:50.10%;top:25.99%;width:4.57%;height:20.34%"></button>
        <button type="button" class="port" data-port="1" data-row="bottom" aria-label="Port ge-0/0/1" style="left:23.62%;top:55.93%;width:4.48%;height:19.21%"></button>
        <button type="button" class="port" data-port="3" data-row="bottom" aria-label="Port ge-0/0/3" style="left:28.86%;top:55.93%;width:4.57%;height:19.21%"></button>
        <button type="button" class="port" data-port="5" data-row="bottom" aria-label="Port ge-0/0/5" style="left:34.19%;top:55.93%;width:4.48%;height:19.21%"></button>
        <button type="button" class="port" data-port="7" data-row="bottom" aria-label="Port ge-0/0/7" style="left:39.43%;top:55.93%;width:4.57%;height:19.21%"></button>
        <button type="button" class="port" data-port="9" data-row="bottom" aria-label="Port ge-0/0/9" style="left:44.76%;top:55.93%;width:4.57%;height:19.21%"></button>
        <button type="button" class="port" data-port="11" data-row="bottom" aria-label="Port ge-0/0/11" style="left:50.10%;top:55.93%;width:4.57%;height:19.21%"></button>
      </div>
    </div>
    <section class="legend-card" aria-labelledby="legend-title">
      <h2 id="legend-title">Role colors</h2>
      <div id="legend"></div>
      <p class="hint" id="legend-hint">Ports 1–12 light from the access role. Click a lit port to pin its details. The 1G, SFP, and management ports on the right stay dark.</p>
    </section>
  </main>
  <script src="/static/demo.js"></script>
</body>
</html>
