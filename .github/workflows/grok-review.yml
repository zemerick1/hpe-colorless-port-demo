# AI review on pull requests via the Grok CLI.
#
# Repository secret required:
#   XAI_API_KEY  — API key from https://console.x.ai
#
# This workflow posts the review as a pull request comment. It never
# approves the pull request. Grok runs without always-approve: dontAsk
# plus the allow rules below are the only tools it can use, and the
# GitHub token is withheld until the comment step.

name: grok-review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Install Grok CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Prepare diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > .grok-pr.diff
          git log --format='%h %s' "origin/${{ github.base_ref }}..HEAD" > .grok-pr-commits.txt

      - name: Review PR
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          GROK_REVIEW_PROMPT: |
            You are reviewing pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.
            The commits are in .grok-pr-commits.txt. The full diff against origin/${{ github.base_ref }} is in .grok-pr.diff.
            Read those files. Read source files when the diff is not enough to judge a change.
            Review for bugs, regressions, and missing tests. Be specific. Do not rubber-stamp the change.
            Write the full review to .grok-review.md, and make that same review your final message.
            Say what you checked. Name any bug, regression, or missing test that should block merge, and say where it is.
            Non-blocking notes can follow, clearly marked as non-blocking.
            Do not approve the pull request. Do not run git or gh. Git and gh are refused.
            Do not edit any file other than .grok-review.md.
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::error::Repo secret XAI_API_KEY is empty. Add an API key from https://console.x.ai"
            exit 1
          fi
          grok --version
          : > .grok-review.md
          set +e
          grok -p "$GROK_REVIEW_PROMPT" \
            --permission-mode dontAsk \
            --max-turns 20 \
            --no-subagents \
            --disable-web-search \
            --output-format streaming-messages-json \
            --allow 'Read' \
            --allow 'Grep' \
            --allow 'Edit(.grok-review.md)' \
            --deny 'Bash(git *)' \
            --deny 'Bash(gh *)' \
            > .grok-review.json
          set -e
          python3 - <<'PY'
          import json
          import pathlib
          written = pathlib.Path(".grok-review.md").read_text(encoding="utf-8").strip()
          final = ""
          log = pathlib.Path(".grok-review.json")
          if log.exists():
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get("type") == "result" and event.get("result"):
                      final = str(event["result"]).strip()
          body = written or final
          if not body:
              raise SystemExit("Grok did not produce a review")
          pathlib.Path(".grok-review.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Post review as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s .grok-review.md ]; then
            echo "::error::Grok did not write a review to .grok-review.md"
            exit 1
          fi
          gh pr review "$PR_NUMBER" --comment --body-file .grok-review.md
